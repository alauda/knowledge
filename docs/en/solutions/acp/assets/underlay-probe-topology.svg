  <text x="44" y="811" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#546779">Verify ip route get and actual packet captures: the source must be the node join IP.</text>
<text x="805" y="728" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#74501c">Underlay network</text><text x="44" y="842" font-family="Noto Sans SC, sans-serif" font-size="21" fill="#546779">Traffic leaving through ovn0 alone does not prove that the return path works.</text><text x="1019" y="281" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#116e5c">Pod</text></svg>