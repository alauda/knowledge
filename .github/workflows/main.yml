name: Build and Update

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    environment: translate
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      XSY_CLIENT_ID: ${{ secrets.XSY_CLIENT_ID }}
      XSY_CLIENT_SECRET: ${{ secrets.XSY_CLIENT_SECRET }}
      XSY_PASSWORD: ${{ secrets.XSY_PASSWORD }}
      XSY_USERNAME: ${{ secrets.XSY_USERNAME }}
      RAW_TERMS_URL: https://gist.github.com/JounQin/8f323563651794ec371588c0d5c3bf1b/raw/71f1eae4f5744e4a78b95244c1d1fa9305d8c471/terms.yaml
      AZURE_OPENAI_MODEL: gpt-4o-mini
    permissions:
      contents: write  # 必需：允许 push 到 PR
      pull-requests: write 

    steps:
      - name: Checkout 
        uses: actions/checkout@v4
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 可根据项目调整

      - name: Setup Yarn
        run: corepack enable

      # - name: Upgrade dependencies
      #   run: |
      #     yarn up @alauda/doom
      #     yarn up -R '**'

      - name: Install dependencies (immutable)
        run: yarn --immutable

      # The integrity check is what stands between a truncated machine
      # translation and the published site, so it is itself tested -- on every
      # event, not just the pushes that translate.
      - name: Test the translation integrity check
        run: yarn test:translation

      # The unit tests above prove the check works; they do not look at a single
      # document. On main that job belongs to "Translate and verify", but that
      # step only runs on a push -- so until now a pull request could add or
      # edit a page and nothing compared it against its English source. The
      # branch scope does exactly that, for the pairs this branch touches.
      - name: Check the translations this branch changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-translation-integrity.mjs --since origin/${{ github.base_ref }}

      - name: generate id
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./add_id.sh docs/en/solutions && ./add_id.sh docs/en/articles

      # Translate, verify, and retranslate whatever came back incomplete. A single
      # pass is not trustworthy: this model has dropped a whole section, invented
      # a table, and rewritten link targets into the literal `URL` from its own
      # prompt example -- none of which the build would notice. If a document is
      # still incomplete after the retries, this step fails and nothing is
      # committed, so a short page never reaches the site.
      - name: Translate and verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/translate-verified.mjs

      - name: Build
        run: yarn build

      - name: Commit 
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "ci: update file from GitHub Action [skip ci]" || echo "Nothing to commit"
      
      - name: Push changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ad-m/github-push-action@master
        with:
          branch: ${{ github.ref }}
          github_token: ${{ secrets.KNOWLEDGE_SECRET }}

      # Nothing is committed unless the build passes, so a failed run otherwise
      # discards the generated translations and leaves no way to see what the
      # model produced. Keep them for post-mortems. docs/en is included because
      # add_id.sh rewrites it earlier in the same run.
      - name: Upload generated docs on failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs-${{ github.run_id }}
          path: |
            docs/en
            docs/zh
          retention-days: 7
